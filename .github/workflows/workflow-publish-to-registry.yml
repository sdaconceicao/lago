name: Publish to Registry

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      cached-build-id:
        description: "ID for cached build"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      RELEASED_VERSION: ${{ steps.released-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore Build
        uses: actions/cache/restore@v5
        id: restore-build
        with:
          path: ./*
          key: ${{ inputs.cached-build-id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Get Released Version
        id: released-version
        run: echo "version=$(node -pe "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build
        run: pnpm run build

      - name: Measure release core bundle
        run: pnpm size:record "$RUNNER_TEMP/lago-bundle-size/bundle-size.json"

      - name: Preserve release measurement
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-${{ steps.released-version.outputs.version }}
          path: ${{ runner.temp }}/lago-bundle-size/bundle-size.json
          if-no-files-found: error
          overwrite: true

      # Trusted publishing (OIDC) requires npm >= 11.5.1, which is newer than
      # the npm bundled with Node 24.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish

  bundle-baseline:
    name: Save published bundle baseline
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download successful release measurement
        uses: actions/download-artifact@v4
        with:
          name: bundle-size-${{ needs.publish.outputs.RELEASED_VERSION }}
          path: ${{ runner.temp }}/lago-bundle-size

      - name: Attach baseline to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.publish.outputs.RELEASED_VERSION }}
        run: |
          for attempt in {1..6}; do
            if gh release view "lago-v$RELEASE_VERSION" >/dev/null 2>&1; then
              gh release upload "lago-v$RELEASE_VERSION" \
                "$RUNNER_TEMP/lago-bundle-size/bundle-size.json" --clobber
              exit 0
            fi
            sleep 10
          done
          echo "GitHub release lago-v$RELEASE_VERSION is missing; baseline was not saved." >&2
          exit 1
